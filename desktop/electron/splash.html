<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>XPIA Tools Desktop Edition</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: #0a0a0a;
        color: #e5e7eb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
        overflow: hidden;
      }
      .wrap {
        text-align: center;
        transform: translateY(-6%);
      }
      .mark {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.09em;
        color: #f3f4f6;
      }
      .mark .accent {
        color: #818cf8;
      }
      .spinner {
        margin: 30px auto 0;
        width: 34px;
        height: 34px;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #818cf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .sub {
        margin-top: 22px;
        font-size: 13px;
        letter-spacing: 0.02em;
        color: #9ca3af;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2s;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">XPIA <span class="accent">Tools</span></div>
      <div class="spinner"></div>
      <div class="sub">Starting the local server&hellip;</div>
    </div>
  </body>
</html>
