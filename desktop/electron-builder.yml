appId: com.xpiatools.desktop
productName: XPIA Tools
copyright: Copyright © Jacob Adams

directories:
  output: release
  buildResources: build

# The compiled server, its production-only dependencies, and the built client are staged
# into ./payload by scripts/stage-payload.cjs, which then packs the whole payload into a
# single ./payload.asar (sharp's native tree unpacked to payload.asar.unpacked alongside).
# Staging installs prod-only deps and drops the cloud/telemetry SDKs the desktop never
# loads (Cosmos, App Insights + OpenTelemetry, gRPC). We build our OWN payload.asar because
# electron-builder strips a foreign node_modules from the app asar; shipping the payload as
# one archive means NSIS writes ~1 file instead of ~17k loose ones, so the installer no
# longer stalls mid-unpack. entry.cjs loads the server through resources/payload.asar.
files:
  - electron/**/*
  - "!electron/main.ts"
  - "!electron/**/*.test.cjs"

extraResources:
  - from: payload.asar
    to: payload.asar
  - from: payload.asar.unpacked
    to: payload.asar.unpacked

# Auto-update feed. electron-builder generates `latest.yml` (the update manifest)
# next to the installer and embeds `app-update.yml` in the app so electron-updater
# knows to look here. The repo is public, so clients need no token to check/download.
publish:
  provider: github
  owner: skajake1983
  repo: xpia-tools-oss

win:
  target:
    - nsis

nsis:
  # One-click per-user install: no elevation and no folder-choice step — the reliable
  # path for silent auto-updates. An assisted installer's silent update intermittently
  # fails with "Failed to uninstall old application files" because its running-app
  # Retry prompt is suppressed; one-click per-user avoids that whole class.
  oneClick: true
  perMachine: false
  # Launch the app when the installer finishes — the visible "done" signal for a one-click
  # install, after which the in-app first-run splash takes over. (Auto-updates run silently
  # via quitAndInstall(isSilent, isForceRunAfter=true), so they relaunch regardless.)
  runAfterFinish: true
  # A custom NSIS include (build/installer.nsh) labels the file-unpack phase so it doesn't
  # look frozen. electron-builder auto-detects that file.
  # Space-free on purpose: electron-updater's latest.yml refers to the installer as
  # `XPIA-Tools-Setup-<version>.exe`, and GitHub rewrites spaces in asset names — so a
  # `${productName}` (spaced) filename would not match the manifest and break updates.
  artifactName: XPIA-Tools-Setup-${version}.${ext}
