appId: com.xpiatools.desktop
productName: XPIA Tools
copyright: Copyright © Jacob Adams

directories:
  output: release
  buildResources: build

# The packaged app itself is tiny — just the Electron main. The server (compiled),
# its node_modules, and the built client ship as resources (outside the asar), so
# native modules like sharp load without any asar-unpack handling.
files:
  - electron/**/*
  - "!electron/main.ts"

extraResources:
  - from: ../server/dist
    to: server/dist
  - from: ../server/node_modules
    to: server/node_modules
  - from: ../client/dist
    to: client/dist

# Auto-update feed. electron-builder generates `latest.yml` (the update manifest)
# next to the installer and embeds `app-update.yml` in the app so electron-updater
# knows to look here. The repo is public, so clients need no token to check/download.
publish:
  provider: github
  owner: skajake1983
  repo: xpia-tools-oss

win:
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Space-free on purpose: electron-updater's latest.yml refers to the installer as
  # `XPIA-Tools-Setup-<version>.exe`, and GitHub rewrites spaces in asset names — so a
  # `${productName}` (spaced) filename would not match the manifest and break updates.
  artifactName: XPIA-Tools-Setup-${version}.${ext}
