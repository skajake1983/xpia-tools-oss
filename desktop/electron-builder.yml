appId: com.xpiatools.desktop
productName: XPIA Tools
copyright: Copyright © Jacob Adams

directories:
  output: release
  buildResources: build

# The compiled server, its production-only dependencies, and the built client are
# staged into ./payload by scripts/stage-payload.cjs, then shipped as resources.
# Staging installs prod-only deps and drops the cloud/telemetry SDKs the desktop
# never loads (Cosmos, App Insights + OpenTelemetry, gRPC) — ~64% fewer files than
# the old full node_modules copy, so the NSIS installer unpacks far faster. These
# stay outside the asar so sharp's native binaries load without extra handling.
files:
  - electron/**/*
  - "!electron/main.ts"

extraResources:
  - from: payload/server/dist
    to: server/dist
  - from: payload/server/node_modules
    to: server/node_modules
  - from: payload/client/dist
    to: client/dist

# Auto-update feed. electron-builder generates `latest.yml` (the update manifest)
# next to the installer and embeds `app-update.yml` in the app so electron-updater
# knows to look here. The repo is public, so clients need no token to check/download.
publish:
  provider: github
  owner: skajake1983
  repo: xpia-tools-oss

win:
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Space-free on purpose: electron-updater's latest.yml refers to the installer as
  # `XPIA-Tools-Setup-<version>.exe`, and GitHub rewrites spaces in asset names — so a
  # `${productName}` (spaced) filename would not match the manifest and break updates.
  artifactName: XPIA-Tools-Setup-${version}.${ext}
